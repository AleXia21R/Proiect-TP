<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Guess The Drawing</title>
  <link rel="stylesheet" href="style1.css">
</head>
<body>

<div id="startScreen" class="screen">
  <h1>GUESS THE DRAWING</h1>
  <input id="playerNameInput" placeholder="Numele tau">
  <br>
  <button onclick="joinGame()">JOIN GAME</button>
</div>

<div id="lobbyScreen" class="screen hidden">
  <h1>Lobby</h1>
  <p id="hostInfo"></p>

  <div id="lobbyPlayers"></div>

  <div id="hostSettings" class="hidden">
    <h2>Setari joc</h2>

    <p>Runde: <span id="roundsText">3</span></p>
    <button onclick="changeRounds(-1)">-</button>
    <button onclick="changeRounds(1)">+</button>

    <p>Timp desen:</p>
    <button onclick="setDrawTime(20)">20s</button>
    <button onclick="setDrawTime(30)">30s</button>
    <button onclick="setDrawTime(45)">45s</button>
    <button onclick="setDrawTime(60)">60s</button>

    <p id="timeText">60s</p>

    <button onclick="hostStartGame()">INCEPE JOCUL</button>
  </div>

  <p id="waitingText">Asteapta ca hostul sa porneasca jocul...</p>
</div>

<div id="wordChoiceScreen" class="screen hidden">
  <h1>Alege cuvantul</h1>
  <h2 id="drawerChoiceText"></h2>
  <div id="wordChoices"></div>
</div>

<div id="gameScreen" class="hidden">
  <div class="topBar">
    <h1>GUESS THE DRAWING</h1>
    <h2 id="timerText">60</h2>
  </div>

  <div class="mainLayout">
    <div class="playersPanel">
      <p id="roundText"></p>
      <h2>Jucatori</h2>
      <div id="playersList"></div>
    </div>

    <div class="centerArea">
      <h2 id="drawerText"></h2>

      <canvas id="canvas" width="1050" height="650"></canvas>

      <div class="tools">
        <div id="palette" class="palette"></div>

        <button onclick="selectEraser()">Radiera</button>
        <button onclick="clearCanvas()">Sterge</button>

        <button onclick="changeBrush(-2)">-</button>
        <span id="brushText">8</span>
        <button onclick="changeBrush(2)">+</button>
      </div>
    </div>

    <div class="chatPanel">
      <h2>Chat</h2>

      <div id="chatMessages"></div>

      <div class="guessBox">
        <input id="guessInput" placeholder="Scrie raspunsul">
        <button onclick="sendGuess()">Trimite</button>
      </div>
    </div>
  </div>
</div>

<div id="finalScreen" class="screen hidden">
  <h1>Joc terminat!</h1>
  <div id="finalScores"></div>
  <button onclick="location.reload()">Joaca din nou</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script1.js"></script>

</body>
</html>
